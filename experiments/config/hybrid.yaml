# 混合压缩配置 (知识蒸馏 + 剪枝 + 量化)
teacher:
  model_name: bert-base-uncased

student:
  model_name: bert-base-uncased
  num_labels: 2

# 阶段1: 知识蒸馏
distillation:
  temperature: 2.0
  alpha: 0.5
  beta: 0.3
  gamma: 0.2
  num_epochs: 20
  learning_rate: 2.0e-5

# 阶段2: 结构化剪枝
pruning:
  head_pruning_ratio: 0.3
  ffn_pruning_ratio: 0.25
  num_epochs: 10
  learning_rate: 1.0e-5

# 阶段3: 量化
quantization:
  bits: 8
  symmetric: true
  per_channel: true
  quantize_embeddings: false
  num_epochs: 5
  learning_rate: 2.0e-6

training:
  batch_size: 32
  weight_decay: 0.01
  max_grad_norm: 1.0

data:
  dataset: sst2
  max_length: 128

output:
  dir: ./results/hybrid
